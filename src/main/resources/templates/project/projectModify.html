<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div id="member" >
    Member
    <div th:if="${adminUserId} == ${loginUserId}">
        <form th:action="@{/projects/{projectId}/members/delete(projectId=${project.id()})}" method="post">
            <div th:each="member : ${members}">
                <!-- | ... | : Thymeleaf의 문자열 리터럴 치환 문법-->
                <input type="checkbox" name="userIds" th:value="${member.id()}" th:id="|member-${member.id()}|"/>
                <label th:for="|member-${member.id()}|" th:text="${member.name()}"></label>
            </div>
            <button type="submit">삭제</button>
        </form>

        <form class="mt-2" th:action="@{/projects/{projectId}/members(projectId=${project.id()})}" method="post">
            <input type="text" placeholder="이메일을 입력해주세요" name="email" required>
            <button type="submit">멤버 추가</button>
        </form>
    </div>

    <div th:unless="${adminUserId} == ${loginUserId}">
        <div th:each="member : ${members}" th:text="${member.name()}"></div>
    </div>
</div>

<div class="mt-3">
    ProjectName
    <form th:action="@{/projects/{projectId}/modify(projectId=${project.id()})}" th:object="${projectModify}" method="post">
        <input type="text" th:field="*{projectName}"/>
        <div class="text-muted mt-2" th:error="*{projectName}"></div>
        <select class="form-select" th:field="*{status}" required>
            <option th:each="status : ${projectStatus}" th:value="${status.name}" th:text="${status.name}" ></option>
        </select>
        <button type="submit">수정</button>
    </form>
</div>

<div id="tag" class="mt-3">
    TAG
    <span th:if="${#lists.isEmpty(tags)}">등록된 태그가 없습니다.</span>
    <form th:action="@{/projects/{projectId}/tags/delete(projectId=${project.id()})}" th:object="${tagDeleteRequest}" method="post">

        <div th:each="tag : ${tags}">
            <!-- | ... | : Thymeleaf의 문자열 리터럴 치환 문법-->
            <input type="checkbox" name="tagIds" th:value="${tag.id()}" th:id="|tag-${tag.id()}|"/>
            <label th:for="|tag-${tag.id()}|" th:text="${tag.name()}"></label>
        </div>
        <div class="text-muted mt-2" th:error="*{tagIds}"></div>
        <button type="submit">삭제</button>
    </form>

    <form th:action="@{/projects/{projectId}/tags(projectId=${project.id()})}" th:object="${tagCreateRequest}" method="post">
        <input type="text" th:field="*{name}"/>
        <div class="text-muted mt-2" th:error="*{name}"></div>
        <button type="submit">+</button>
    </form>
</div>

<div id="mileStone">
    MileStone
    <span th:if="${#lists.isEmpty(milestones)}">등록된 마일스톤이 없습니다.</span>
    <form th:action="@{/projects/{projectId}/milestones/delete(projectId=${project.id()})}" method="post">
        <div th:each="milestone : ${milestones}">
            <input type="checkbox" name="milestoneIds" th:value="${milestone.id()}" th:id="|tag-${milestone.id()}|"/>
            <label th:for="|milestone-${milestone.id()}|" th:text="${milestone.name()}"></label>
        </div>

        <button type="submit">삭제</button>
    </form>

    <form th:action="@{/projects/{projectId}/milestones(projectId=${project.id()})}" th:object="${milestoneCreateRequest}" method="post">
        <input type="text" th:field="*{name}"/>
        <div class="text-muted mt-2" th:error="*{name}"></div>
        <button type="submit">+</button>
    </form>
</div>

</body>
</html>
