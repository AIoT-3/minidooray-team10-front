<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 수정</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>

<div th:replace="~{fragment/header :: header}"></div>

<div class="container py-5">
    <h2 class="text-center mb-5">프로젝트 수정</h2>
    <div class="row g-4">
        <!-- 프로젝트 인원 (왼쪽) -->
        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-bold">Member</div>
                <div class="card-body d-flex flex-column">

                    <!-- 위쪽 목록 -->
                    <div class="flex-grow-1">

                        <div th:if="${adminUserId} == ${loginUserId}">
                            <form th:action="@{/projects/{projectId}/members/delete(projectId=${project.id()})}" method="post">

                                <div class="d-flex justify-content-end mb-2">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">
                                        멤버 삭제
                                    </button>
                                </div>

                                <div th:each="member : ${members}" class="mb-2">

                                    <input type="checkbox" name="userIds" th:value="${member.id()}" th:id="|member-${member.id()}|" th:disabled="${adminUserId} == ${member.id()}"/>
                                    <label th:for="|member-${member.id()}|" th:text="${member.name()}"></label>

                                </div>
                            </form>
                        </div>
                        <div th:unless="${adminUserId} == ${loginUserId}">
                            <div th:each="member : ${members}" th:text="${member.name()}"></div>
                        </div>
                    </div>

                    <form class="mt-auto" th:action="@{/projects/{projectId}/members(projectId=${project.id()})}" method="post">
                        <div class="input-group">
                            <input class="form-control" type="email" name="email" placeholder="이메일 입력" required>
                            <button class="btn btn-primary btn-sm" type="submit">멤버 추가</button>
                        </div>
                    </form>

                    <div class="mt-2 text-danger" th:text="${errorMsg}"></div>

                </div>
            </div>
        </div>


        <!-- 우측 (프로젝트, 태그, 마일스톤) -->
        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header fw-bold">Project</div>
                <div class="card-body">
                    <form th:action="@{/projects/{projectId}/modify(projectId=${project.id()})}" th:object="${projectModifyRequest}" method="post">
                        <input class="form-control mb-2" type="text" th:field="*{projectName}" placeholder="프로젝트 이름">

                        <div class="text-danger mb-2" th:errors="*{projectName}"></div>

                        <select class="form-select mb-3" th:field="*{status}" required>
                            <option th:each="status : ${projectStatus}" th:value="${status.name}" th:text="${status.name}"></option>
                        </select>

                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary" type="submit">수정</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow-sm h-100">
                        <div class="card-header fw-bold">Tag</div>
                        <div class="card-body">
                            <span class="text-danger" th:if="${#lists.isEmpty(tags)}">등록된 태그가 없습니다.</span>

                            <form th:action="@{/projects/{projectId}/tags/delete(projectId=${project.id()})}" method="post">
                                <div class="d-flex justify-content-end mb-0">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                                </div>
                                <div th:each="tag : ${tags}" class="mb-2">
                                    <input type="checkbox" name="tagIds" th:value="${tag.id()}" th:id="|tag-${tag.id()}|"/>
                                    <label th:for="|tag-${tag.id()}|" th:text="${tag.name()}"></label>
                                </div>
                            </form>

                            <form class="mt-auto" th:action="@{/projects/{projectId}/tags(projectId=${project.id()})}" method="post">
                                <div class="input-group">
                                    <input class="form-control" type="text" name="name" placeholder="Tag Name" required/>
                                    <button class="btn btn-primary btn-sm" type="submit">+</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm h-100">
                        <div class="card-header fw-bold">Milestone</div>
                        <div class="card-body">

                            <span class="text-danger" th:if="${#lists.isEmpty(milestones)}">등록된 마일스톤이 없습니다.</span>

                            <form th:action="@{/projects/{projectId}/milestones/delete(projectId=${project.id()})}" method="post">
                                <div class="d-flex justify-content-end mb-0">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                                </div>                                <div th:each="milestone : ${milestones}" class="mb-2">
                                    <input type="checkbox" name="milestoneIds" th:value="${milestone.id()}" th:id="|milestone-${milestone.id()}|"/>

                                    <label th:for="|milestone-${milestone.id()}|" th:text="${milestone.name()}"></label>
                                </div>

                            </form>

                            <form class="mt-auto" th:action="@{/projects/{projectId}/milestones(projectId=${project.id()})}" method="post">
                                <div class="input-group">
                                    <input class="form-control" type="text" name="name" placeholder="Milestone Name" required/>
                                    <button class="btn btn-primary btn-sm" type="submit">+</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
