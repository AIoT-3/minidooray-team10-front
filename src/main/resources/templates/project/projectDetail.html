<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<h3 th:text="${project.name()}"></h3>

<a class="btn btn-warning" th:href="@{/projects/{projectId}/tasks(projectId=${project.id()})}">Task 생성</a>

<div>
    <!-- TODO milestone 별로 task 분리 -->
    <input type="button" th:each="milestone : ${milestones}" th:value="${milestone.name()}"/>
    <a th:each="task : ${tasks}" class="btn btn-outline-dark"
       th:text="${task.title}"
        th:href="@{/projects/{projectId}/tasks/{taskId}(projectId=${project.id()}, taskId=${task.id()})}">
    </a>
</div>
</body>
</html>
