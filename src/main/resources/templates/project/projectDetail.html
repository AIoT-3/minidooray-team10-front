<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project 상세</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragment/header :: header}"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 th:text="${project.name()}"></h2>

        <a class="btn btn-outline-primary"
           th:href="@{/projects/{projectId}/tasks(projectId=${project.id()})}">
            Task 생성
        </a>
    </div>

    <div th:if="${#lists.isEmpty(tasks)}">
        <h2 class="text-muted mb-5">등록된 Task가 없습니다.</h2>
    </div>

    <div th:each="milestone : ${milestones}"
         class="card shadow-sm mb-4">

        <div class="card-header fw-bold"
             th:text="${milestone.name()}">
        </div>

        <div class="card-body">

            <!-- task 있을 때 -->
            <a th:each="task : ${tasks}"
               th:if="${task.milestoneId == milestone.id}"
               class="card mb-3 text-decoration-none text-dark border"

               th:href="@{/projects/{projectId}/tasks/{taskId}
               (projectId=${project.id()},taskId=${task.id})}">

                <div class="card-body
                            d-flex
                            justify-content-between
                            align-items-center">

                    <span class="fw-semibold"
                          th:text="${task.title}">
                    </span>

                    <small class="text-muted">
                        <span th:text="${task.startDate}"></span>
                        ~
                        <span th:text="${task.deadline}"></span>
                    </small>

                </div>
            </a>

        </div>
    </div>

</div>

</body>
</html>
