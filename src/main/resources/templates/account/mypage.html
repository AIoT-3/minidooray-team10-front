<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>

<body>
<div th:replace="~{fragment/header :: header}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">마이페이지</h3>

                    <form th:action="@{/mypage}" th:object="${memberModifyRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">이메일</label>
                            <input class="form-control" th:value="${email}" readonly/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">비밀번호</label>
                            <input class="form-control" type="password" th:field="*{password}" placeholder="새 비밀번호 입력"/>
                            <div class="text-danger small mt-1" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">이름</label>
                            <input class="form-control" th:field="*{name}" placeholder="이름 입력"/>
                            <div class="text-danger small mt-1" th:errors="*{name}"></div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">정보 수정</button>
                    </form>

                    <hr class="my-4">


                    <form th:action="@{/withdraw}" method="post">
                        <button type="submit" class="btn btn-danger w-100">
                            회원탈퇴
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
