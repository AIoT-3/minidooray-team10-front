<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <title>로그인</title>

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com"/>

    <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>

<body>

<video class="bg-video" autoplay muted loop>
    <source th:src="@{/assets/mp4/bg.mp4}" type="video/mp4"/>
</video>

<div class="masthead">
    <div class="masthead-content text-white">
            <h1 class="fst-italic lh-1 mb-2">MiniDooray</h1>
            <h1 class="fst-italic lh-1 mb-4">Login</h1>
            <p class="mb-5">Spring Project Team10</p>

            <form action="/login/process" method="post">
                <div class="row input-group-newsletter">
                    <div class="col">
                        <input class="form-control" name="email" placeholder="Email"/>
                    </div>
                </div>

                <div class="row input-group-newsletter mt-3">
                    <div class="col">
                        <input class="form-control" type="password" name="pwd" placeholder="Password"/>
                    </div>
                </div>

                <div th:if="${errorMessage}" class="mt-2 text text-muted">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="row mt-4">
                        <button class="btn btn-primary" type="submit">Login</button>
                </div>
                <div class="row mt-4">
                    <a th:href="@{/signup}" class="btn btn-light">SignUp</a>
                </div>

            </form>
    </div>
</div>
<div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form action="/dormant/unlock" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">휴면 해제</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>휴면해제를 원하시면 하단의 버튼을 클릭해주세요.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">해제</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="social-icons">
    <div class="d-flex flex-row flex-lg-column justify-content-center align-items-center h-100 mt-3 mt-lg-0">
        <a class="btn btn-dark m-3" href="https://github.com/AIoT-3/minidooray-team10-gateway"><i class="fab fa-github"></i></a>
        <a class="btn btn-dark m-3" href="#"><i class="fab fa-google"></i></a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>

<script th:if="${dormantModal}">
    document.addEventListener("DOMContentLoaded", function () {
        const modal = new bootstrap.Modal(document.getElementById('modal'), {
            backdrop: false
        });
        modal.show();
    });
</script>
</body>
</html>
