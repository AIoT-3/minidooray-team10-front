<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 상세</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragment/header :: header}"></div>
    <h2 class="text-center mt-5" th:text="${task.title()}"></h2>

    <div class="container py-5">
        <div class="row g-4 justify-content-center">

            <!-- Task 상세 -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold">Task 상세내역</div>

                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Status</label>
                            <input class="form-control" type="text"
                                   th:value="*{task.status().name()}" readonly/>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">작성자 아이디</label>
                            <input class="form-control" type="text"
                                   th:value="*{task.writerId()}" readonly/>

                            <label class="form-label fw-semibold mt-4">시작일</label>
                            <input class="form-control" type="text"
                                   th:value="*{task.startDate()}" readonly/>

                            <label class="form-label fw-semibold mt-4">마감일</label>
                            <input class="form-control" type="text"
                                   th:value="*{task.deadline()}" readonly/>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Tags</label>
                            <div>
                                <div class="btn btn-outline-primary"
                                     th:each="tag : ${task.tags()}"
                                     th:text="${tag.name()}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">MileStone</label>
                            <div>
                                <div class="btn btn-outline-primary" th:text="${task.milestoneName()}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Content</label>
                            <textarea class="rounded-3 p-3"
                                      style="height: 200px; width: 100%; resize: none;"
                                      th:text="${task.content()}" readonly></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a class="btn btn-outline-warning"
                               th:href="@{/projects/{projectId}/tasks/{taskId}/modify(projectId=${projectId}, taskId=${task.id()})}">
                                수정
                            </a>
                            <form th:action="@{/projects/{projectId}/tasks/{taskId}/delete(projectId=${projectId}, taskId=${task.id()})}"
                                  method="post">
                                <button class="btn btn-danger" type="submit">삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Comment -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold">Comment</div>

                    <div class="card-body">
                        <div class="mt-2">
                            <form th:action="@{/projects/{projectId}/tasks/{taskId}/comments(projectId=${projectId}, taskId=${task.id()})}"
                                  th:object="${commentAddTaskRequest}"
                                  method="post">

                            <textarea id="createContent"
                                      class="rounded-3 p-3"
                                      style="height: 60px; width: 100%; resize: none;"
                                      maxlength="500"
                                      th:field="*{content}"></textarea>

                                <div class="text-danger mt-1" th:errors="*{content}"></div>

                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span><span id="createCount">0</span>/500</span>
                                    <button class="btn btn-primary" type="submit">등록</button>
                                </div>
                            </form>
                        </div>

                        <div class="mt-4">
                            <table class="table table-hover">
                                <tbody>
                                <tr th:if="${#lists.isEmpty(comments)}">
                                    <td>등록된 댓글이 없습니다.</td>
                                </tr>

                                <tr th:each="comment : ${comments}">
                                    <td>
                                        <div th:if="${comment.writerId() == loginUserId}">
                                            <div class="d-flex align-items-center gap-2">

                                                <form th:action="@{/projects/{projectId}/tasks/{taskId}/comments/{commentId}/modify(projectId=${projectId}, taskId=${task.id()}, commentId=${comment.id()})}" method="post" class="d-flex align-items-center gap-2 flex-grow-1">

                                                <textarea name="content"
                                                          class="rounded-3 p-3 flex-grow-1"
                                                          style="height: 70px; resize: none;"
                                                          maxlength="500"
                                                          th:text="${comment.content()}"></textarea>

                                                    <button class="btn btn-warning" type="submit">수정</button>
                                                </form>

                                                <form th:action="@{/projects/{projectId}/tasks/{taskId}/comments/{commentId}/delete(projectId=${projectId},taskId=${task.id()},commentId=${comment.id()})}"
                                                      method="post">
                                                    <button class="btn btn-danger" type="submit">삭제</button>
                                                </form>

                                            </div>
                                        </div>

                                        <div th:unless="${comment.writerId() == loginUserId}">
                                            <span th:text="${comment.content()}"></span>
                                        </div>

                                    </td>
                                </tr>

                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
    <script>
        const createArea = document.getElementById('createContent');
        const createCnt = document.getElementById('createCount');

        function updateCreateCount() {
            createCnt.textContent = createArea.value.length;
        }

        createArea.addEventListener('input', updateCreateCount);

        updateCreateCount();
    </script>
</body>
</html>
