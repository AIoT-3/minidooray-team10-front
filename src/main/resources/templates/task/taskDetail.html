<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div>
        <h4 th:text="${task.title()}"></h4>
        <div>
            Status : <span th:text="${task.status().name()}"></span>
        </div>
        <div class="mt-1">
            작성자 아이디 : <span th:text="${task.writerId()}"></span>
            시작일 : <span th:text="${task.startDate()}"></span>
            마감일 : <span th:text="${task.deadline()}"></span>
        </div>

        <div>
            Tags : <span th:each="tag : ${task.tags()}" th:text="${tag.name()} + ' '"></span>
        </div>
        <div>
            MileStone : <span th:text="${task.milestoneName()}"></span>
        </div>

        <textarea style="height: 200px; width: 500px; resize: none;" th:text="${task.content()}" readonly></textarea>

        <a class="btn btn-outline-warning" th:href="@{/projects/{projectId}/tasks/{taskId}/modify(projectId=${projectId}, taskId=${task.id()})}" th:text="수정"></a>
        <form th:action="@{/projects/{projectId}/tasks/{taskId}/delete(projectId=${projectId}, taskId=${task.id()})}" class="d-inline" method="post">
            <button class="btn btn-outline-danger" type="submit">삭제</button>
        </form>
    </div>

<div class="mt-2">
    <h4> Comment </h4>

    <form th:action="@{/projects/{projectId}/tasks/{taskId}/comments(projectId=${projectId}, taskId=${task.id()})}"
          th:object="${commentAddRequest}" method="post">
        <textarea id="createContent" style="height: 50px; width: 400px; resize: none;" maxlength="500" th:field="*{content}"></textarea>
        <div>
            <span id="createCount">0</span>/500
            <button class="btn btn-dark" type="submit">등록</button>
        </div>
    </form>

    <div class="mt-2">
        <table class="table table-hover">
            <thead>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(comments)}">
                    <td>등록된 댓글이 없습니다.</td>
                </tr>

            <tr th:each="comment : ${comments}">
                <td>
                    <div th:if="${comment.writerId() == loginUserId}">
                        <form th:action="@{/projects/{projectId}/tasks/{taskId}/comments/{commentId}/modify(projectId=${projectId}, taskId=${task.id()}, commentId=${comment.id()})}" method="post">
                            <textarea name="content" style="height: 70px; width: 400px; resize: none;" maxlength="500" th:text="${comment.content()}"></textarea>
                            <button class="btn btn-outline-warning" type="submit">수정</button>
                        </form>
                        <form th:action="@{/projects/{projectId}/tasks/{taskId}/comments/{commentId}/delete(projectId=${projectId},taskId=${task.id()},commentId=${comment.id()})}" method="post">

                            <button class="btn btn-outline-danger" type="submit" >삭제</button>
                        </form>
                    </div>

                    <div th:unless="${comment.writerId() == loginUserId}">
                        <span th:text="${comment.content()}"></span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
    <script>
        const createArea = document.getElementById('createContent');
        const createCnt = document.getElementById('createCount');

        function updateCreateCount() {
            createCnt.textContent = createArea.value.length;
        }

        createArea.addEventListener('input', updateCreateCount);

        updateCreateCount();
    </script>
</body>
</html>
